name: Mac app

# Builds the .dmg on an Apple silicon runner. A version tag (v0.9.0) also makes a draft GitHub release with it,
# to check and publish by hand. Run it from the Actions tab to just get the .dmg as a download.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build, check and make the .dmg
        run: packaging/build_mac.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Audiobook-Maker-mac
          path: dist-build/*.dmg
          retention-days: 14
      - name: Draft a release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-build/*.dmg --draft --prerelease \
            --title "Audiobook Maker ${GITHUB_REF_NAME#v} (beta)" --notes-file packaging/release-notes.md

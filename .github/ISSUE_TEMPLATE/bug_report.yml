name: Something isn't working
description: Tell us what went wrong so it can be fixed.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: In the app, open Settings, click **Copy details** under About, and paste here. It has the app and
        macOS versions, and no personal information.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (optional)
      description: Settings → About → **Show log** opens it. Paste the last 50 lines or so. Book text may appear in it,
        so look it over first.
      render: text
